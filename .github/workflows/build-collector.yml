name: Build Collector

on:
  workflow_dispatch:
  push:
    branches:
      - market-data-collector

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      RUST_TOOLCHAIN: 1.85.1

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libcurl4-openssl-dev zlib1g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build collector
        run: cargo +${{ env.RUST_TOOLCHAIN }} build --release -p barter-collector

      - name: Show GLIBC requirements
        run: |
          file target/release/barter-collector
          ldd target/release/barter-collector
          strings target/release/barter-collector | grep 'GLIBC_' | sort -Vu | tail -20

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: barter-collector-linux-x86_64
          path: target/release/barter-collector
